<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Send OTP</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-100 px-4 py-10 text-slate-900">
      <main class="mx-auto max-w-lg">
        <section class="rounded-lg border border-slate-200 bg-white p-6 shadow-sm sm:p-8">
          <div>
            <header class="mb-8">
              <p class="text-sm font-semibold text-teal-700">OTP test</p>
              <h1 class="mt-2 text-2xl font-bold">Send OTP</h1>
              <p class="mt-2 text-sm leading-6 text-slate-500">Enter an email address to receive a six-digit code.</p>
            </header>

            <form id="send-otp-form" class="space-y-5">
              <div>
                <label for="email" class="mb-2 block text-sm font-semibold text-slate-700">Email address</label>
                <input id="email" name="email" type="email" placeholder="student@example.com" autocomplete="email" required class="w-full rounded-xl border border-slate-300 px-4 py-3 text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-teal-600 focus:ring-4 focus:ring-teal-100" />
              </div>

              <div class="flex flex-col gap-3 sm:flex-row">
                <button type="submit" class="flex-1 rounded-xl bg-teal-700 px-5 py-3 font-semibold text-white transition hover:bg-teal-800 focus:outline-none focus:ring-4 focus:ring-teal-200">Send OTP</button>
                <button type="button" id="resend-button" class="rounded-xl border border-slate-300 px-5 py-3 font-semibold text-slate-700 transition hover:border-teal-600 hover:text-teal-700 focus:outline-none focus:ring-4 focus:ring-teal-100">Resend</button>
              </div>
            </form>

            <div id="status" class="mt-6 rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-600" aria-live="polite">No OTP has been sent yet.</div>
            <a href="/verify" class="mt-6 inline-flex text-sm font-semibold text-teal-700 hover:text-teal-900">Already have a code? Verify it <span aria-hidden="true" class="ml-1">&rarr;</span></a>
          </div>
        </section>
      </main>

    <script src="/app.js"></script>
  </body>
</html>
