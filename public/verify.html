<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Verify OTP</title>
    <style>
      body { font-family: Arial, sans-serif; max-width: 640px; margin: 40px auto; padding: 20px; }
      form { display: grid; gap: 12px; }
      input, button { padding: 10px 12px; font-size: 1rem; }
      .status { margin-top: 12px; padding: 12px; border-radius: 8px; background: #f2f2f2; }
      .error { background: #fdecea; color: #7f1d1d; }
      .success { background: #eafaf1; color: #14532d; }
    </style>
  </head>
  <body>
    <header>
      <h1>Verify OTP</h1>
      <p>Submit the email and the 6-digit OTP to validate it.</p>
    </header>

    <main>
      <form id="verify-otp-form">
        <label for="verify-email">Email address</label>
        <input id="verify-email" name="email" type="email" placeholder="student@example.com" required />

        <label for="otp">OTP</label>
        <input id="otp" name="otp" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="123456" required />

        <button type="submit">Verify OTP</button>
      </form>

      <div id="status" class="status" aria-live="polite">No OTP has been validated yet.</div>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
