<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Verify OTP</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-100 px-4 py-10 text-slate-900">
      <main class="mx-auto max-w-lg">
        <section class="rounded-lg border border-slate-200 bg-white p-6 shadow-sm sm:p-8">
          <div>
            <header class="mb-8">
              <p class="text-sm font-semibold text-sky-700">OTP test</p>
              <h1 class="mt-2 text-2xl font-bold">Verify OTP</h1>
              <p class="mt-2 text-sm leading-6 text-slate-500">Enter the email and the newest code from your inbox.</p>
            </header>

            <form id="verify-otp-form" class="space-y-5">
              <div>
                <label for="verify-email" class="mb-2 block text-sm font-semibold text-slate-700">Email address</label>
                <input id="verify-email" name="email" type="email" placeholder="student@example.com" autocomplete="email" required class="w-full rounded-xl border border-slate-300 px-4 py-3 text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-sky-600 focus:ring-4 focus:ring-sky-100" />
              </div>

              <div>
                <label for="otp" class="mb-2 block text-sm font-semibold text-slate-700">Six-digit OTP</label>
                <input id="otp" name="otp" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="000000" autocomplete="one-time-code" required class="w-full rounded-xl border border-slate-300 px-4 py-4 text-center text-2xl font-bold tracking-[0.45em] text-slate-900 outline-none transition placeholder:text-slate-300 focus:border-sky-600 focus:ring-4 focus:ring-sky-100" />
                <p class="mt-2 text-xs text-slate-500">Your email is filled in automatically. Enter the newest code immediately; it expires after 30 seconds.</p>
              </div>

              <button type="submit" class="w-full rounded-xl bg-sky-700 px-5 py-3 font-semibold text-white transition hover:bg-sky-800 focus:outline-none focus:ring-4 focus:ring-sky-200">Verify code</button>
            </form>

            <div id="status" class="mt-6 rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-600" aria-live="polite">No OTP has been validated yet.</div>
            <a href="/" class="mt-6 inline-flex text-sm font-semibold text-sky-700 hover:text-sky-900">&larr; Request a new code</a>
          </div>
        </section>
      </main>

    <script src="/app.js"></script>
  </body>
</html>
